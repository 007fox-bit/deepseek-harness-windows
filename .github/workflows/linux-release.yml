name: Build Linux x64 packages

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official DeepSeek Harness tag to build
        required: true
        default: dsh-v0.2.1-rc.3
        type: string
      publish:
        description: Publish or replace assets in a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: linux-x64-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux x64 AppImage and DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out community packaging
        uses: actions/checkout@v4
        with:
          path: community

      - name: Check out official source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ inputs.upstream_tag }}
          fetch-depth: 1
          path: upstream

      - name: Apply and verify Linux packaging patch
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../community/patches/linux-desktop-rc3.patch
          git apply ../community/patches/linux-desktop-rc3.patch
          git diff --check
          printf 'UPSTREAM_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install locked dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Run Linux packaging tests
        working-directory: upstream
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/desktop-build-paths.spec.ts
          apps/desktop/tests/package-target.spec.ts
          apps/desktop/tests/desktop-package-environment.spec.ts
          apps/desktop/tests/runtime-preparation.spec.ts
          apps/desktop/tests/cli-launcher.spec.ts
          apps/desktop/tests/installer-packaging.spec.ts

      - name: Build AppImage and DEB
        working-directory: upstream
        shell: bash
        env:
          CI: "true"
        run: |
          set +e
          pnpm run package:desktop:linux:x64:dir
          status=$?
          if (( status != 0 )); then
            resources="$(realpath apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/linux-unpacked/resources)"
            archive="$resources/app.asar"
            executable="$(realpath apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/linux-unpacked/deepseek-harness)"
            echo "::group::LibreOffice ASAR entries"
            pnpm --filter @deepseek-ai/dsh-desktop exec node --input-type=module -e '
              import { readAsar } from "app-builder-lib/out/asar/asar.js"
              const archive = await readAsar(process.argv[1])
              const entries = []
              const visit = (node, path) => {
                if (node.files !== undefined) {
                  for (const [name, child] of Object.entries(node.files)) visit(child, `${path}/${name}`)
                } else if (path.includes("libreoffice-kit")) entries.push(`${path}${node.unpacked === true ? " [unpacked]" : ""}`)
              }
              visit(archive.getFile("dsh", false), "dsh")
              console.log(entries.join("\n"))
            ' "$archive"
            echo "::endgroup::"
            echo "::group::LibreOffice unpacked entries"
            find "$archive.unpacked/dsh/node_modules" -path '*libreoffice-kit*' -maxdepth 8 -print 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::Electron module search"
            ELECTRON_RUN_AS_NODE=1 "$executable" -e '
              const { createRequire } = require("node:module")
              const { join } = require("node:path")
              const { lstatSync } = require("node:fs")
              const request = "@deepseek-ai/libreoffice-kit-linux-x64-glibc"
              const localRequire = createRequire(process.argv[1])
              for (const directory of localRequire.resolve.paths(request) ?? []) {
                const candidate = join(directory, request)
                const status = lstatSync(candidate, { throwIfNoEntry: false })
                console.log(JSON.stringify({ candidate, exists: status !== undefined, directory: status?.isDirectory() }))
              }
              try { console.log(JSON.stringify({ resolved: localRequire.resolve(`${request}/package.json`) })) }
              catch (error) { console.log(JSON.stringify({ resolutionError: error.message })) }
            ' "$resources/app.asar/dsh/node_modules/@deepseek-ai/libreoffice-kit/lib/index.js"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Collect and verify release assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source_dir="apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts"
          version="$(node -p "require('./package.json').version")"
          appimage="$(find "$source_dir" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find "$source_dir" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          mkdir -p ../community/dist
          appimage_out="../community/dist/DeepSeek-Harness-${version}-Linux-x86_64.AppImage"
          deb_out="../community/dist/DeepSeek-Harness-${version}-Linux-amd64.deb"
          cp "$appimage" "$appimage_out"
          cp "$deb" "$deb_out"
          chmod +x "$appimage_out"
          dpkg-deb --info "$deb_out"
          "$appimage_out" --appimage-extract >/dev/null
          test -x squashfs-root/deepseek-harness
          test -f squashfs-root/resources/app.asar
          ELECTRON_RUN_AS_NODE=1 squashfs-root/deepseek-harness -e "process.stdout.write(process.versions.electron ? 'electron-ok\\n' : 'missing-electron\\n')"
          rm -rf squashfs-root
          mkdir deb-root
          dpkg-deb --extract "$deb_out" deb-root
          deb_executable="$(find deb-root -type f -path '*/deepseek-harness' -perm -u+x -print -quit)"
          test -n "$deb_executable"
          ELECTRON_RUN_AS_NODE=1 "$deb_executable" -e "process.stdout.write(process.versions.electron ? 'electron-ok\\n' : 'missing-electron\\n')"
          (
            cd ../community/dist
            sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
          )
          {
            printf 'Upstream tag: %s\n' '${{ inputs.upstream_tag }}'
            printf 'Upstream commit: %s\n' "$UPSTREAM_COMMIT"
            printf 'Community workflow run: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > ../community/dist/BUILD_INFO-linux.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ inputs.upstream_tag }}-linux-x64
          path: community/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: ${{ inputs.publish }}
        working-directory: community
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${UPSTREAM_TAG#dsh-v}"
          release_tag="${UPSTREAM_TAG}-community-linux"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "DeepSeek Harness ${version} Community Linux x64" \
              --prerelease \
              --notes "Unofficial unsigned Linux x64 community build from official ${UPSTREAM_TAG}. Includes AppImage and DEB packages. Verify SHA256SUMS-linux.txt before installation. Automatic updates and official Linux support are not included."
          fi
          gh release upload "$release_tag" dist/* --clobber
